<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ganpati Bappa Morya 🙏</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="scene">

        <!-- Decorative lights -->
        <div class="lights">
            <span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span>
        </div>

        <!-- Halo -->
        <div class="halo"></div>

        <!-- Ganpati -->
        <div class="ganpati">

            <!-- Crown -->
            <div class="crown">
                <div class="crown-top">ॐ</div>
                <div class="crown-body"></div>
                <div class="jewel"></div>
            </div>

            <!-- Head -->
            <div class="head">

                <!-- Ears -->
                <div class="ear left-ear"></div>
                <div class="ear right-ear"></div>

                <!-- Eyes -->
                <div class="eye left-eye"></div>
                <div class="eye right-eye"></div>

                <!-- Tilak -->
                <div class="tilak">
                    <span></span>
                    <span></span>
                </div>

                <!-- Trunk -->
                <div class="trunk">
                    <div class="trunk-tip"></div>
                </div>

                <!-- Tusks -->
                <div class="tusk left-tusk"></div>
                <div class="tusk right-tusk"></div>

            </div>

            <!-- Body -->
            <div class="body">

                <!-- Arms -->
                <div class="arm left-arm">
                    <div class="hand">
                        <span>☝</span>
                    </div>
                </div>

                <div class="arm right-arm">
                    <div class="hand">
                        <span>🌸</span>
                    </div>
                </div>

                <!-- Belly -->
                <div class="belly"></div>

                <!-- Dhoti -->
                <div class="dhoti"></div>

            </div>

            <!-- Mouse -->
            <div class="mouse">
                <div class="mouse-ear left"></div>
                <div class="mouse-ear right"></div>
                <div class="mouse-eye"></div>
                <div class="mouse-nose"></div>
                <div class="mouse-tail"></div>
            </div>

        </div>

        <!-- Diyas -->
        <div class="diya left-diya">
            🪔
        </div>

        <div class="diya right-diya">
            🪔
        </div>

        <h1>गणपति बप्पा मोरया</h1>
        <p>🙏 मंगल मूर्ति मोरया 🙏</p>

    </div>

    <script src="script.js"></script>
</body>
</html>
